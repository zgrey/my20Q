<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my20Q · Caregiver Cockpit</title>
    <!-- Apply the saved theme before first paint to avoid a flash. Dark is
         the default (:root); only "light" sets an attribute. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {
          /* localStorage unavailable — fall through to the dark default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
