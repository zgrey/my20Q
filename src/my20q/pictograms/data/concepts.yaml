# Curated AAC concept catalog.
#
# Each concept maps query/synthesis text to one ARASAAC pictogram.
# `keywords` drive retrieval (matched against the text); `arasaac_query`
# is the search term scripts/fetch_icons.py resolves against the ARASAAC
# API to download assets/arasaac/<id>.png. Edit freely — add concepts as
# the topic list grows.

