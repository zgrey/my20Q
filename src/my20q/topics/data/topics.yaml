# Flat topic list — the high-level contexts that anchor each round.
#
# This file is meant to be edited directly. Each entry is a topic the
# caregiver can pick from the cockpit dropdown. Reasoning mode drives all
# questioning under the topic — there is no canned question bank (a reasoning
# failure surfaces a diagnostic card, never a pre-written question).
#
# `core_facets` are the 5W1H slots that must be confidently determined before
# a synthesis counts as board-ready under this topic; the remaining slots are
# modifiers, placeholdered when unknown.
#
# Convention: pin `emergency` first and the catch-all `general` last.

- id: emergency
  label: Get help now
  emergency: true
  description: >-
    Urgent needs. Pinned first. Selecting it short-circuits the dialogue to a
    hard-coded caregiver-call / 911 screen — the LLM is bypassed entirely.

- id: mental_health
  label: My feelings
  description: Emotional or mental state the patient wants to communicate.
  # Feelings topic: physical wants (thirst, toilet, ...) are off-topic noise here.
  seed_universal_wants: false
  # The feeling itself (what) and its cause/object (why) define the need.
  core_facets: [what, why]
  # Drill tie-breaker only — evidence always dominates. Feelings are often
  # about a person, so who outranks how; place/time rarely matter.
  facet_priority: [what, why, who, how, when, where]
  reasoning_hint: |
    Stay on FEELINGS and inner states — loneliness, fear, worry about loved
    ones, frustration (especially at not being understood), sadness, boredom,
    anger, restlessness, grief for lost abilities, positive feelings like
    wanting joy or company — AND the non-emotion inner states that matter
    just as much: CONFUSION (about what she is seeing, hearing, or what is
    happening around her), feeling overwhelmed, and disorientation. Do NOT
    seed or ask about physical needs (thirst, hunger, toilet, pain,
    temperature) — those belong to the body topic. Lean on the patient
    profile for what they care about and worry about. Never enumerate
    emotion names one per question — broad kinds first (upset vs confused vs
    missing someone), then narrow.

    Map the slots accordingly: "what" = the feeling or state itself (fear,
    sadness, anger, loneliness, worry, frustration, shame, restlessness,
    longing, confusion, overwhelm); "why" = its CAUSE or OBJECT (a specific
    person, the news / what is on TV, her body or independence, the future,
    the home); "who" = the person it concerns, when there is one. Identify
    the feeling itself, never merely whether she wishes to express it
    (banned: "do you want to share how you feel" — everyone says yes).

- id: physical_health
  label: My body
  description: Physical needs or discomfort.
  # A body report is sensation + location before anything: what (the
  # want/discomfort) and where (the BODY region) gate readiness; the remedy
  # (how) follows. 06-11 trial: location starved while "where" was a modifier
  # holding room-place seeds. Non-localized wants (thirst) leave "where"
  # empty — the caregiver ✗-mutes it or accepts pre-ready.
  core_facets: [what, where]
  # Drill tie-breaker only — evidence always dominates (see my_people note).
  facet_priority: [what, where, how, why, when, who]
  reasoning_hint: |
    In this topic "where" means a place ON THE BODY, never a room: head,
    face, mouth, neck, shoulders, arms, hands, chest, stomach, back, hips,
    legs, knees, feet — and one side versus the other (left/right). Seed and
    ask "where" with body regions, narrowing region → side → specific part
    ("Is it in your legs?" → "Is it the right leg?" → "Is it in the thigh?").

    Map the slots: "what" = the sensation or want itself (pain, tingling,
    numbness, itching, pressure, dizziness, nausea, thirst, hunger, needing
    the toilet, feeling too hot or too cold, tiredness); "where" = the body
    region when the need is localized (a want like thirst may have none —
    that is fine); "how" = the remedy or action wanted (adjust position,
    bring a drink, rub it, a blanket, fetch the caregiver); "why" = the
    suspected cause, only if it emerges on its own. Establish WHAT is felt
    and WHERE on the body early — before exploring causes or remedies, and
    never linger on furniture or the room when the person reports a body
    feeling.

- id: my_people
  label: My people
  description: >-
    Family the patient wants to communicate about. Replace per-patient with
    real names via the caregiver profile (Phase 5).
  # People topic: physical wants are off-topic; seed about the people instead.
  seed_universal_wants: false
  # The person (who) and the intent toward them (how) define the need; "what"
  # (the object involved) usually emerges while drilling.
  core_facets: [who, how]
  # Drill tie-breaker ONLY — evidence always dominates. In a caregiving
  # context "where" is usually implied, so it ranks last among equals; "what"
  # usually holds the unknown, so it leads the modifiers. A round genuinely
  # about placing a thing somewhere specific still drills "where" on merit.
  facet_priority: [who, how, what, why, when, where]
  # Track intent DIRECTION: the four buckets below become standing "how"
  # contenders, credited by the code classifier, with the sign-flip rule and
  # the caregiver ask-order prior (see profile `caregivers:`).
  direction: true
  reasoning_hint: |
    HARD EXCLUSION: never ask about physical or descriptive attributes of
    these people — appearance, age, height, weight, build, clothing, hair,
    where they live, etc. The patient knows them well; those questions
    reveal nothing. If you catch yourself forming such a question, discard
    it and ask from the buckets below instead.

    The "how" slot of every question in this topic must fit exactly one of
    four buckets about the patient's intent toward the person:

      1. I need to do something TO or FOR them.
         (call them, visit them, give them something, help them, thank
         them, apologize, take them somewhere.)
      2. They need to do something FOR or TO me.
         (bring something, help me, stay with me, fix something, take me
         somewhere.)
      3. I need to convey information TO them.
         (tell them news, share how I feel, warn them, remind them of
         something, say I love them.)
      4. I have a question FOR them.
         (where are they, when are they coming, did they do X, how are
         they feeling.)

    If it is not yet clear which bucket applies, ask a yes/no question that
    splits among them ("Do you want to do something for them?", "Do you need
    them to do something?", "Do you want to tell them something?"). Once the
    bucket is known, narrow the specific action or piece of information, and
    pin down WHO by name or relation (parent vs spouse vs child vs sibling) —
    never by physical traits.

    Never synthesize "Your <relation>" as the answer — the relation alone is
    never the answer. The answer is always a specific action or a specific
    piece of information tied to a person.

- id: general
  label: Other
  description: General comfort and engagement needs. Catch-all, pinned last.
  core_facets: [what, how]
  # Drill tie-breaker only: object + action first, location next.
  facet_priority: [what, how, where, who, why, when]
