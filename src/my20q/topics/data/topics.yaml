# Flat topic list — the high-level contexts that anchor each round.
#
# This file is meant to be edited directly. Each entry is a topic the
# caregiver can pick from the cockpit dropdown. Reasoning mode drives all
# questioning under the topic — there is no canned question bank (a reasoning
# failure surfaces a diagnostic card, never a pre-written question).
#
# `core_facets` are the 5W1H slots that must be confidently determined before
# a synthesis counts as board-ready under this topic; the remaining slots are
# modifiers, placeholdered when unknown.
#
# Convention: pin `emergency` first and the catch-all `general` last.

- id: emergency
  label: Get help now
  emergency: true
  description: >-
    Urgent needs. Pinned first. Selecting it short-circuits the dialogue to a
    hard-coded caregiver-call / 911 screen — the LLM is bypassed entirely.

- id: mental_health
  label: My feelings
  description: Emotional or mental state the patient wants to communicate.
  # Feelings topic: physical wants (thirst, toilet, ...) are off-topic noise here.
  seed_universal_wants: false
  # The feeling itself (what) and its cause/object (why) define the need.
  core_facets: [what, why]
  reasoning_hint: |
    Stay on FEELINGS and emotional states — loneliness, fear, worry about loved
    ones, frustration (especially at not being understood), sadness, boredom,
    anger, restlessness, grief for lost abilities, and positive feelings like
    wanting joy or company. Do NOT seed or ask about physical needs (thirst,
    hunger, toilet, pain, temperature) — those belong to the body topic. Lean on
    the patient profile for what they care about and worry about.

    Map the slots accordingly: "what" = the EMOTION itself (fear, sadness,
    anger, loneliness, worry, frustration, shame, restlessness, longing);
    "why" = its CAUSE or OBJECT (a specific person, the news/world, her body
    or independence, the future, the home); "who" = the person it concerns,
    when there is one. Identify the feeling itself, never merely whether she
    wishes to express it (banned: "do you want to share how you feel" —
    everyone says yes).

- id: physical_health
  label: My body
  description: Physical needs or discomfort.
  # The physical want/discomfort (what) and the action needed (how).
  core_facets: [what, how]

- id: my_people
  label: My people
  description: >-
    Family the patient wants to communicate about. Replace per-patient with
    real names via the caregiver profile (Phase 5).
  # People topic: physical wants are off-topic; seed about the people instead.
  seed_universal_wants: false
  # The person (who) and the intent toward them (how) define the need; "what"
  # (the object involved) usually emerges while drilling.
  core_facets: [who, how]
  # Track intent DIRECTION: the four buckets below become standing "how"
  # contenders, credited by the code classifier, with the sign-flip rule and
  # the caregiver ask-order prior (see profile `caregivers:`).
  direction: true
  reasoning_hint: |
    HARD EXCLUSION: never ask about physical or descriptive attributes of
    these people — appearance, age, height, weight, build, clothing, hair,
    where they live, etc. The patient knows them well; those questions
    reveal nothing. If you catch yourself forming such a question, discard
    it and ask from the buckets below instead.

    The "how" slot of every question in this topic must fit exactly one of
    four buckets about the patient's intent toward the person:

      1. I need to do something TO or FOR them.
         (call them, visit them, give them something, help them, thank
         them, apologize, take them somewhere.)
      2. They need to do something FOR or TO me.
         (bring something, help me, stay with me, fix something, take me
         somewhere.)
      3. I need to convey information TO them.
         (tell them news, share how I feel, warn them, remind them of
         something, say I love them.)
      4. I have a question FOR them.
         (where are they, when are they coming, did they do X, how are
         they feeling.)

    If it is not yet clear which bucket applies, ask a yes/no question that
    splits among them ("Do you want to do something for them?", "Do you need
    them to do something?", "Do you want to tell them something?"). Once the
    bucket is known, narrow the specific action or piece of information, and
    pin down WHO by name or relation (parent vs spouse vs child vs sibling) —
    never by physical traits.

    Never synthesize "Your <relation>" as the answer — the relation alone is
    never the answer. The answer is always a specific action or a specific
    piece of information tied to a person.

- id: general
  label: Other
  description: General comfort and engagement needs. Catch-all, pinned last.
  core_facets: [what, how]
