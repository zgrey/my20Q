[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my20q"
version = "0.1.0-beta"
description = "Assistive game-based agent for accelerating communication in individuals with aphasia"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Zach Grey", email = "zachary.grey@nist.gov" }]
dependencies = [
    # httpx2 is httpx's successor (same author, github.com/pydantic/httpx2).
    # Starlette 1.x deprecated `httpx` for its TestClient and imports httpx2 in
    # preference, so staying on httpx meant carrying BOTH HTTP clients — one
    # for the app, one for the tests. One library, one surface to patch.
    "httpx2>=2.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
api = [
    # >=0.133.0 to pull in Starlette >=1.0.1, which fixes CVE-2026-48710
    # ("BadHost"): a Host-header parsing bug enabling auth bypass -> SSRF.
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.30",
]
trials = [
    "anthropic>=0.49",
]
tts = [
    # Local text-to-speech (piper). Provides the `piper` entry point used
    # by src/my20q/tts/piper_tts.py. A voice model (.onnx + .onnx.json)
    # must also be downloaded and pointed at via MY20Q_PIPER_MODEL.
    "piper-tts>=1.2",
]
kokoro = [
    # Local text-to-speech (Kokoro-82M) — warmer/less robotic than piper.
    # Used by src/my20q/tts/kokoro_tts.py. The model (.onnx) and voices (.bin)
    # files must also be downloaded; see that module's header. Pulls numpy +
    # onnxruntime transitively.
    "kokoro-onnx>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
my20q = "my20q.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my20q"]

[tool.hatch.build.targets.wheel.force-include]
"src/my20q/topics/data" = "my20q/topics/data"
"src/my20q/profiles/data" = "my20q/profiles/data"
"src/my20q/pictograms/data" = "my20q/pictograms/data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
